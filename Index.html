<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Burger website</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" 
        integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" 
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <header>
        
        <div id="stars"></div>
        <div class="navber">
            <img src="Imgs for my project/logo.png" alt="">
            <div class="center-nav">
                <a href="">Home</a>
                <a href="">Menu</a>
                <a href="">About</a>
                <a href="">Shop</a>
            </div>
            <div class="social">
                <a href=""><i class="fa-solid fa-magnifying-glass"></i></a>
                <a href=""><i class="fa-solid fa-basket-shopping"></i></a>
                <a href=""><i class="fa-solid fa-house"></i></a>
            </div>
        </div>
        <div class="text">
            <h1>THE ULTIMATE <br> BURGER HAUEM</h1>
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sapiente nulla, esse </p>
            <a href="" class="btn">Order Now</a>
            <a href="" class="btn">View More</a>
        </div>
        <div class="burger">
            <img src="Imgs for my project/burger.png" alt="">
            <img src="Imgs for my project/pngwing.com (12).png" alt="">
            <img src="Imgs for my project/buger2.png" alt="">
            <img src="Imgs for my project/Flying Burger PNG Image - 2084x2084.png" alt="">
            <img src="Imgs for my project/pngwing.com (13).png" alt="">
        </div>
        <div class="burger-toggle">
            <img src="Imgs for my project/Flying Burger PNG Image - 2084x2084.png" alt="" class="active">
        </div>

    </header>

    <script>
        const burgerImages = document.querySelectorAll('.burger img');
        const toggleImages = document.querySelectorAll('.burger-toggle img');
        let currentIndex = 0;

        toggleImages[currentIndex].classList.add('active');

        burgerImages.forEach((img, index) => {
            img.addEventListener('click', () => {
                toggleImages.forEach(toggleImg => toggleImg.classList.remove('active'));
                toggleImages[currentIndex].classList.add('active');
                toggleImages[currentIndex].src = burgerImages[index].src;
                currentIndex = (currentIndex + 1) % toggleImages.length;
            });
        });

        // Generate random stars
        function createStars() {
            const starContainer = document.getElementById('stars');
            const windowWidth = window.innerWidth;
            const windowHeight = window.innerHeight;

            for (let i = 0; i < 100; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                star.style.left = `${Math.random() * windowWidth}px`;
                star.style.top = `${Math.random() * windowHeight}px`;
                starContainer.appendChild(star);
            }
        }

        // Call createStars function when the page loads
        window.addEventListener('load', createStars);
    </script>
</body>
</html>
